name: Publish scheduled articles and videos (backup)

# BACKUP ONLY since 2026-10-07. GitHub ran this "every 10 minutes" schedule
# only every 3-8 hours in practice, so a campaign due at 2:32 PM never sent.
# The real scheduler is now Supabase pg_cron (supabase/migrations/
# 0024_pg_cron_schedules.sql), which calls publish-scheduled every minute
# and the weekly-reminder / welcome endpoints every 10. This stays as a
# harmless safety net for publish-scheduled only (sends/publishes are claimed
# atomically, so a duplicate call can't double-send). The reminder and
# welcome steps were removed from here: the reminder has no "already sent"
# flag, so a stray extra call inside its window would post twice.

# Vercel's native Cron Jobs are capped at once/day on the Hobby plan
# regardless of the schedule configured in vercel.json, which is why
# articles scheduled later in the day were sitting unpublished for up
# to 24 hours. This workflow pings the same endpoint far more often so
# scheduled publish times are actually honored. Since 2026-08-28, the
# same endpoint also publishes due video_uploads rows (YouTube/TikTok)
# — no second workflow/cron job needed, this one now covers both.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-scheduled endpoint
        run: |
          curl -sf -X POST "https://atlas-blog-generator.vercel.app/api/cron/publish-scheduled" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
