name: Publish scheduled articles and videos

# Vercel's native Cron Jobs are capped at once/day on the Hobby plan
# regardless of the schedule configured in vercel.json, which is why
# articles scheduled later in the day were sitting unpublished for up
# to 24 hours. This workflow pings the same endpoint far more often so
# scheduled publish times are actually honored. Since 2026-08-28, the
# same endpoint also publishes due video_uploads rows (YouTube/TikTok)
# — no second workflow/cron job needed, this one now covers both.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-scheduled endpoint
        run: |
          curl -sf -X POST "https://atlas-blog-generator.vercel.app/api/cron/publish-scheduled" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
      # Monday 5:30 PM / 6:00 PM PT Discord call reminders — the endpoint
      # checks the real current Pacific time itself and no-ops outside
      # those two windows, so this same every-10-minutes ping is what
      # drives it (see pages/api/cron/weekly-reminder.ts for why).
      - name: Trigger weekly-reminder endpoint
        run: |
          curl -sf -X POST "https://atlas-blog-generator.vercel.app/api/cron/weekly-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
      # Welcomes any Discord member who joined since the last check (see
      # pages/api/cron/welcome-new-members.ts) — up to a ~10 min delay
      # after joining, same tradeoff as the reminders above.
      - name: Trigger welcome-new-members endpoint
        run: |
          curl -sf -X POST "https://atlas-blog-generator.vercel.app/api/cron/welcome-new-members" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
